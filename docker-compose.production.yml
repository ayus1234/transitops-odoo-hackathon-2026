version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: transitops_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-transitops_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transitops_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-transitops_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transitops_admin -d transitops_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: transitops_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: transitops_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-transitops_admin}:${POSTGRES_PASSWORD:-transitops_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-transitops_db}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-transitops_jwt_secret_key_change_in_production}
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: transitops_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
